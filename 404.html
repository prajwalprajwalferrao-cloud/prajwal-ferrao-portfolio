<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found | Prajwal Ferrao</title>
  <meta name="description" content="The page you are looking for does not exist." />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/index.css" />
  <style>
    .not-found-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-6);
      position: relative;
      z-index: 1;
    }
    .not-found-code {
      font-family: var(--font-mono);
      font-size: clamp(4rem, 15vw, 9rem);
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: var(--space-4);
      letter-spacing: -0.05em;
    }
    .not-found-title {
      font-size: clamp(1.5rem, 4vw, 2.25rem);
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: var(--space-3);
    }
    .not-found-desc {
      max-width: 480px;
      color: var(--text-secondary);
      font-size: var(--text-base);
      line-height: 1.6;
      margin-bottom: var(--space-6);
    }
    .not-found-actions {
      display: flex;
      gap: var(--space-3);
      flex-wrap: wrap;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="ambient-glow glow-1" aria-hidden="true"></div>
  <div class="ambient-glow glow-2" aria-hidden="true"></div>

  <main class="not-found-wrapper">
    <div class="not-found-code">404</div>
    <h1 class="not-found-title">Lost in Neural Space</h1>
    <p class="not-found-desc">
      The coordinates you navigated to don't exist or were relocated during system convergence. Let's get you back on track.
    </p>
    <div class="not-found-actions">
      <a href="/" class="btn btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Return to Homepage</span>
      </a>
      <a href="/#contact" class="btn btn-secondary">
        <span>Get in Touch</span>
      </a>
    </div>
  </main>
</body>
</html>
